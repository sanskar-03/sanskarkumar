<div class="cms-field-wrapper {{ extra_class|default:'' }}">
    <label for="{{ field.id_for_label }}">{{ field.label }}</label>

    <div class="field-shell">
        {{ field }}
    </div>

    {% if field.help_text %}
        <small class="field-help">
            {{ field.help_text }}
        </small>
    {% endif %}

    {% for error in field.errors %}
        <small class="field-error">
            {{ error }}
        </small>
    {% endfor %}
</div>
